<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c45a10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="太陽盛德創作歌曲" />
  <meta name="description" content="太陽盛德導師創作歌曲簡易播放：選歌即播，介面精簡。" />
  <link rel="icon" href="../taiyang-icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="../taiyang-icon-180.png" />
  <title>太陽盛德導師創作歌曲｜簡易版</title>
  <style>
    :root { --accent: #c45a10; --muted: #7a5c3a; --line: rgba(196,90,16,0.2); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
      color: #3a2208; line-height: 1.55;
      background: linear-gradient(180deg, #fffbf0, #ffe8c4);
      padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
    }
    .wrap { max-width: 24rem; margin: 0 auto; padding-bottom: 2rem; }
    h1 { text-align: center; font-size: clamp(1rem, 4.5vw, 1.3rem); color: var(--accent); margin-top: 0.5rem; line-height: 1.35; }
    .sub { text-align: center; font-size: 0.82rem; color: var(--muted); margin: 0.25rem 0 0.85rem; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.25rem; }
    select, button {
      width: 100%; font: inherit; font-size: 16px;
      padding: 0.65rem; border: 1px solid var(--line); border-radius: 0.35rem;
    }
    select { background: #fff; margin-bottom: 0.45rem; }
    button.primary {
      background: var(--accent); color: #fff; border-color: var(--accent);
      font-weight: 700; cursor: pointer;
    }
    .player { margin-top: 0.85rem; background: #111; border-radius: 0.45rem; overflow: hidden; aspect-ratio: 16/9; }
    #player { width: 100%; height: 100%; }
    .now {
      margin-top: 0.65rem; padding: 0.65rem 0.75rem;
      background: rgba(255,255,255,0.75); border: 1px solid var(--line); border-radius: 0.35rem;
      font-size: 0.88rem;
    }
    .now strong { color: var(--accent); }
    .foot { margin-top: 1rem; font-size: 0.78rem; color: var(--muted); text-align: center; }
    .foot a { color: var(--accent); }
    .status { margin-top: 0.45rem; font-size: 0.75rem; color: var(--muted); text-align: center; min-height: 1.1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>太陽盛德導師創作歌曲<br /><span style="font-size:0.85em;font-weight:600">簡易版</span></h1>
    <p class="sub">選歌即播 · 介面精簡 · 適合分享</p>

    <label for="songSelect">選擇歌曲</label>
    <select id="songSelect" aria-label="歌曲選單">
      <option value="">— 載入中 —</option>
    </select>
    <button type="button" id="btnPlay" class="primary">▶ 播放</button>

    <div class="player"><div id="player"></div></div>
    <p class="now" id="nowLine">尚未播放</p>
    <p class="status" id="statusLine"></p>

    <p class="foot">
      需要連播、伴唱、分類篩選？→
      <a href="../index.html">開啟完整版</a>
      · <a href="./share.html">加入主畫面</a>
    </p>
  </div>

  <script>
    const CATALOG_URL = "../catalog.json";
    let catalog = { songs: [] };
    let player = null;
    let apiReady = false;
    let pendingId = null;
    let currentId = null;

    const $ = (id) => document.getElementById(id);

    function sortSongs(songs) {
      const pri = songs.filter((s) => s.repeat === 3);
      const masters = songs.filter((s) => s.repeat !== 3 && s.performer === "master");
      const others = songs.filter((s) => s.repeat !== 3 && s.performer === "other");
      pri.sort((a, b) => {
        if (a.id === "hTEv2f-9WIM") return -1;
        if (b.id === "hTEv2f-9WIM") return 1;
        if (a.id === "tkYxdmQlhtQ") return -1;
        if (b.id === "tkYxdmQlhtQ") return 1;
        return 0;
      });
      masters.sort((a, b) => (a.name || "").localeCompare(b.name || "", "zh-Hant"));
      others.sort((a, b) => {
        const c = (a.name || "").localeCompare(b.name || "", "zh-Hant");
        return c !== 0 ? c : (a.performerLabel || "").localeCompare(b.performerLabel || "", "zh-Hant");
      });
      return [...pri, ...masters, ...others];
    }

    function renderMenu() {
      const songs = sortSongs(catalog.songs || []);
      const groups = [
        { label: "優先", items: songs.filter((s) => s.repeat === 3) },
        { label: "導師親唱", items: songs.filter((s) => s.repeat !== 3 && s.performer === "master") },
        { label: "其他演唱者", items: songs.filter((s) => s.repeat !== 3 && s.performer === "other") }
      ];
      let html = '<option value="">— 請選擇 —</option>';
      groups.forEach((g) => {
        if (!g.items.length) return;
        html += '<optgroup label="' + g.label + '">';
        g.items.forEach((s) => {
          const who = s.performer === "master" ? "導師" : (s.performerLabel || "其他");
          html += '<option value="' + s.id + '">' + s.name + "（" + who + "）</option>";
        });
        html += "</optgroup>";
      });
      $("songSelect").innerHTML = html;
      try {
        const last = localStorage.getItem("taiyang-simple-last");
        if (last && songs.some((s) => s.id === last)) $("songSelect").value = last;
      } catch (_) {}
    }

    async function loadCatalog() {
      $("statusLine").textContent = "載入曲庫…";
      try {
        const res = await fetch(CATALOG_URL + "?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) catalog = await res.json();
      } catch (_) {
        try {
          const res = await fetch(CATALOG_URL);
          if (res.ok) catalog = await res.json();
        } catch (__) {}
      }
      renderMenu();
      $("statusLine").textContent = catalog.songs && catalog.songs.length
        ? "共 " + catalog.songs.length + " 首 · 選歌即播"
        : "無法載入曲庫";
    }

    function ensurePlayerHost() {
      const box = document.querySelector(".player");
      if (!box) return;
      const host = document.getElementById("player");
      if (!host || host.tagName === "IFRAME") {
        box.innerHTML = '<div id="player"></div>';
      }
    }

    function playId(videoId, song) {
      if (!videoId) return;
      pendingId = videoId;
      currentId = videoId;
      try { localStorage.setItem("taiyang-simple-last", videoId); } catch (_) {}
      const who = song && song.performer === "master" ? "導師" : (song && song.performerLabel) || "";
      $("nowLine").innerHTML = "<strong>" + (song ? song.name : "—") + "</strong>" + (who ? " · " + who : "");
      $("statusLine").textContent = "切換：" + (song ? song.name : videoId);

      if (player && (typeof player.loadVideoById === "function" || typeof player.cueVideoById === "function")) {
        try { if (player.stopVideo) player.stopVideo(); } catch (_) {}
        let ok = false;
        try {
          player.loadVideoById({ videoId: videoId, startSeconds: 0 });
          ok = true;
        } catch (_) {
          try { player.cueVideoById({ videoId: videoId, startSeconds: 0 }); ok = true; } catch (__) {}
        }
        if (ok) {
          setTimeout(() => { try { player.playVideo && player.playVideo(); } catch (_) {} }, 350);
          return;
        }
        try { if (player.destroy) player.destroy(); } catch (_) {}
        player = null;
      }

      if (apiReady) createPlayer(videoId, true);
      else $("statusLine").textContent = "YouTube 載入中…";
    }

    function playSelected() {
      const id = $("songSelect").value;
      if (!id) { $("statusLine").textContent = "請先選擇歌曲"; return; }
      const song = (catalog.songs || []).find((s) => s.id === id);
      playId(id, song);
    }

    function createPlayer(videoId, autoplay) {
      if (player) {
        try { if (player.destroy) player.destroy(); } catch (_) {}
        player = null;
      }
      ensurePlayerHost();
      player = new YT.Player("player", {
        height: "100%", width: "100%", videoId,
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, enablejsapi: 1, origin: location.origin },
        events: {
          onReady: () => { if (autoplay) try { player.playVideo(); } catch (_) {} },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) $("btnPlay").textContent = "⏸ 暫停";
            else $("btnPlay").textContent = "▶ 播放";
          },
          onError: () => { $("statusLine").textContent = "無法播放，請換另一首"; }
        }
      });
    }

    $("btnPlay").addEventListener("click", () => {
      if (!player) { playSelected(); return; }
      let st = -1;
      try { st = player.getPlayerState(); } catch (_) {}
      if (st === YT.PlayerState.PLAYING) player.pauseVideo();
      else if ($("songSelect").value) {
        // 若選單已換成別首，按播放應播選單那首
        const id = $("songSelect").value;
        if (id && id !== currentId) playSelected();
        else try { player.playVideo(); } catch (_) { playSelected(); }
      } else playSelected();
    });

    $("songSelect").addEventListener("change", playSelected);

    window.onYouTubeIframeAPIReady = function () {
      apiReady = true;
      if (pendingId) playId(pendingId, (catalog.songs || []).find((s) => s.id === pendingId));
    };

    loadCatalog();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=20260909a").catch(() => {});
    }
  </script>
  <script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
