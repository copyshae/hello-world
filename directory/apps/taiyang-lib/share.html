<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8b5a14" />
  <meta name="apple-mobile-web-app-title" content="導師影音庫" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <title>加入主畫面｜太陽盛德導師影音圖書館</title>
  <style>
    :root { --accent: #8b5a14; --muted: #7a6040; }
    body { font-family: "PingFang TC", sans-serif; margin: 0; padding: 2rem 1.2rem; background: #fff8f0; color: #3a2808; line-height: 1.6; }
    .wrap { max-width: 22rem; margin: 0 auto; text-align: center; }
    h1 { color: var(--accent); font-size: clamp(1rem, 4.5vw, 1.35rem); line-height: 1.35; }
    p, ol { text-align: left; color: var(--muted); font-size: 0.92rem; }
    .icon { width: 5.5rem; height: 5.5rem; border-radius: 1rem; margin: 1rem auto 0; object-fit: cover; }
    a.btn { display: block; margin-top: 1rem; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 1rem; border-radius: 0.35rem; }
    .url { margin-top: 0.75rem; padding: 0.75rem; background: #fff; font-size: 0.8rem; word-break: break-all; text-align: left; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>太陽盛德導師<br />親身口述影音圖書館</h1>
    <img class="icon" src="icon-192.png" alt="導師影音庫" />
    <p>收錄導師親口廣播、演講訪談、親唱歌曲，共 488+ 則，圖書館式分類。</p>
    <div class="url" id="url">https://copyshae.github.io/-/taiyang-lib/</div>
    <a class="btn" id="open" href="./index.html">打開影音圖書館</a>
    <ol>
      <li>iPhone：Safari → 分享 → <strong>加入主畫面</strong></li>
      <li>簡易版分享單則：<a id="simple" href="./simple/">simple/?item=…</a></li>
    </ol>
  </div>
  <script>
    var u = location.href.replace(/share\.html.*$/, "");
    if (u.indexOf("http") !== 0) u = "https://copyshae.github.io/-/taiyang-lib/";
    document.getElementById("url").textContent = u;
    document.getElementById("open").href = u;
    document.getElementById("simple").href = u.replace(/\/?$/, "/") + "simple/";
  </script>
</body>
</html>
