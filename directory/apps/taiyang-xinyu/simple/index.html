<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c45c2a" />
  <meta name="apple-mobile-web-app-title" content="太陽心語" />
  <link rel="icon" href="../icon-192.png?v=20260830c" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png?v=20260830c" />
  <title>太陽心語｜簡易版</title>
  <style>
    :root { --accent: #c45c2a; --accent2: #e8945a; --muted: #7a5640; --line: rgba(196,92,42,0.22); --ok: #2f6b3a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", sans-serif; color: #3a2214; line-height: 1.55;
      background: linear-gradient(180deg, #fffdf8, #f5dcc0);
      padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
    }
    .wrap { max-width: 24rem; margin: 0 auto; padding-bottom: 2rem; }
    h1 { text-align: center; font-size: clamp(1rem, 4.5vw, 1.3rem); color: var(--accent); line-height: 1.35; }
    .sub { text-align: center; font-size: 0.8rem; color: var(--muted); margin: 0.25rem 0 0.75rem; }
    .panel { padding: 0.75rem; background: rgba(255,255,255,0.88); border: 1px solid var(--line); border-radius: 0.5rem; margin-top: 0.65rem; }
    input[type="search"] { width: 100%; font: inherit; font-size: 16px; padding: 0.6rem; border: 2px solid var(--accent2); border-radius: 0.4rem; background: #fff; }
    .list { margin-top: 0.45rem; max-height: 9rem; overflow-y: auto; border: 1px solid var(--line); border-radius: 0.35rem; background: #fff; }
    .item { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 0.55rem 0.6rem; cursor: pointer; font: inherit; }
    .item.active { background: rgba(196,92,42,0.08); }
    .item .t { font-size: 0.82rem; font-weight: 600; }
    .item .m { font-size: 0.68rem; color: var(--muted); }
    .img-shell { margin-top: 0.55rem; background: #fff; border: 1px solid var(--line); border-radius: 0.45rem; overflow: hidden; min-height: 12rem; cursor: zoom-in; }
    .img-shell img { width: 100%; display: block; object-fit: contain; max-height: 24rem; background: #faf6f0; }
    .now strong { display: block; color: var(--accent); margin-top: 0.45rem; line-height: 1.4; }
    .now p { font-size: 0.84rem; margin-top: 0.2rem; }
    .now .plain { font-size: 0.78rem; color: var(--muted); }
    button { font: inherit; border: 1px solid var(--line); border-radius: 0.35rem; padding: 0.55rem; cursor: pointer; background: #fff; color: var(--accent); font-weight: 600; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.speaking { background: var(--ok); color: #fff; border-color: var(--ok); }
    .nav { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem; align-items: center; }
    .nav button { flex: 1 1 calc(33% - 0.25rem); font-size: 0.82rem; }
    .nav-pos { flex: 0 0 100%; text-align: center; font-size: 0.72rem; color: var(--muted); }
    button:disabled { opacity: 0.4; cursor: default; }
    .lightbox-nav:disabled { opacity: 0.35; cursor: default; }
    .mode { margin-top: 0.45rem; font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; }
    .mode input { accent-color: var(--accent); }
    .foot { margin-top: 1rem; font-size: 0.76rem; color: var(--muted); text-align: center; }
    .foot a { color: var(--accent); }
    .img-shell { cursor: zoom-in; }
    .lightbox {
      position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column;
      background: rgba(20, 12, 8, 0.92);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .lightbox[hidden] { display: none !important; }
    .lightbox-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.75rem; color: #fff8f0; }
    .lightbox-head .title { flex: 1; font-size: 0.86rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lightbox-head button { font: inherit; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; border-radius: 0.35rem; padding: 0.45rem 0.6rem; cursor: pointer; font-weight: 700; }
    .lightbox-body { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0.35rem 0.75rem; position: relative; }
    .lightbox-body img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 0.35rem; background: #fff; }
    .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); font: inherit; border: 0; background: rgba(255,255,255,0.15); color: #fff; width: 2.4rem; height: 2.4rem; border-radius: 999px; cursor: pointer; }
    .lightbox-nav.prev { left: 0.25rem; }
    .lightbox-nav.next { right: 0.25rem; }
    .lightbox-foot { padding: 0 0.75rem 0.65rem; color: rgba(255,248,240,0.92); font-size: 0.8rem; line-height: 1.5; max-height: 24vh; overflow-y: auto; }
    .lightbox-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; padding-top: 0.45rem; border-top: 1px solid rgba(255,255,255,0.15); }
    .lightbox-actions button { flex: 1; font: inherit; border: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.1); color: #fff; border-radius: 0.4rem; padding: 0.6rem; cursor: pointer; font-weight: 700; }
    .lightbox-actions button.primary { background: var(--accent); border-color: var(--accent); }
    .lb-hint { margin-top: 0.4rem; font-size: 0.72rem; color: rgba(255,248,240,0.65); text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>太陽心語<br /><span style="font-size:0.85em">簡易版</span></h1>
    <p class="sub">直接瀏覽切換 · 點目錄可彈出大圖</p>

    <section class="panel">
      <input type="search" id="searchBox" placeholder="搜尋…" autocomplete="off" />
      <div class="list" id="itemList"></div>
    </section>

    <section class="panel">
      <div class="img-shell"><img id="mainImg" alt="太陽心語" /></div>
      <div class="now" id="nowBox">
        <strong id="nowTitle">—</strong>
        <p id="nowText"></p>
        <p class="plain" id="nowPlain"></p>
      </div>
      <div class="nav">
        <span class="nav-pos" id="navPos">—</span>
        <button type="button" id="btnPrev">◀ 上一則</button>
        <button type="button" class="primary" id="btnRead">🔊 朗讀</button>
        <button type="button" id="btnNext">下一則 ▶</button>
      </div>
      <label class="mode"><input type="checkbox" id="silentMode" /> 無聲模式</label>
    </section>

    <p class="foot">
      <a href="../index.html">完整版</a>
      · <a href="../share.html">加入主畫面</a>
    </p>
  </div>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true">
    <div class="lightbox-head">
      <p class="title" id="lbTitle">太陽心語</p>
      <span id="lbPos" style="font-size:0.68rem;opacity:0.75;white-space:nowrap;"></span>
      <button type="button" id="lbRead">🔊</button>
      <button type="button" id="lbClose">✕</button>
    </div>
    <div class="lightbox-body">
      <button type="button" class="lightbox-nav prev" id="lbPrev">◀</button>
      <img id="lbImg" alt="太陽心語" />
      <button type="button" class="lightbox-nav next" id="lbNext">▶</button>
    </div>
    <div class="lightbox-foot">
      <p id="lbText"></p>
      <p id="lbPlain" style="color:rgba(255,248,240,0.72);margin-top:0.2rem;font-size:0.76rem;"></p>
      <div class="lightbox-actions">
        <button type="button" class="primary" id="lbReadFoot">🔊 朗讀</button>
        <button type="button" id="lbStopFoot" hidden>⏹ 停止</button>
        <button type="button" id="lbCloseFoot">✕ 關閉</button>
      </div>
      <p class="lb-hint">彈出後可自行選擇是否朗讀，或直接關閉</p>
    </div>
  </div>

  <script src="../ocr-read.js?v=2"></script>
  <script src="../read-text.js?v=8"></script>
  <script src="../../shared/tts-voices.js?v=3"></script>
  <script>
    const CATALOG_URL = "../catalog.json?v=20260830g";
    let items = [];
    let filtered = [];
    let idx = 0;
    const $ = (id) => document.getElementById(id);

    function encodeImageUrl(url) {
      if (!url || !/^https?:\/\//i.test(url)) return url;
      try {
        const u = new URL(url);
        u.pathname = u.pathname.split("/").map(function (seg) {
          if (!seg) return seg;
          try { seg = decodeURIComponent(seg); } catch (_) {}
          return encodeURIComponent(seg);
        }).join("/");
        return u.href;
      } catch (_) { return encodeURI(url); }
    }

    function imageChain(it, base) {
      const chain = [];
      if (it.imageUrl) chain.push(encodeImageUrl(it.imageUrl));
      if (it.imageLocal) chain.push(base + it.imageLocal);
      const card = base + "cards/" + it.id + ".png";
      if (chain.indexOf(card) < 0) chain.push(card);
      return chain;
    }

    function imgSrc(it) {
      const chain = imageChain(it, "../");
      return chain[0] || "";
    }

    function bindImageFallback(imgEl, it) {
      if (!imgEl || !it) return;
      const chain = imageChain(it, "../");
      let step = 0;
      imgEl.onerror = function () {
        step += 1;
        if (step < chain.length) {
          imgEl.src = chain[step];
        } else {
          imgEl.alt = "圖片無法載入";
          imgEl.onerror = null;
        }
      };
    }

    function speechText(it) {
      return window.TaiyangReadText ? window.TaiyangReadText.speechText(it) : "";
    }

    function displayQuote(it) {
      if (window.TaiyangReadText && window.TaiyangReadText.displayQuote) {
        return window.TaiyangReadText.displayQuote(it);
      }
      if (!it) return { title: "太陽心語", text: "", plain: "" };
      return { title: it.title || "太陽心語", text: it.text || "", plain: it.plain || "" };
    }

    function setReadingUi(on) {
      const label = on ? "朗讀中…" : "🔊 朗讀";
      $("btnRead").classList.toggle("speaking", on);
      $("btnRead").textContent = label;
      if ($("lbRead")) $("lbRead").textContent = on ? "🔊…" : "🔊";
      if ($("lbReadFoot")) { $("lbReadFoot").textContent = label; $("lbReadFoot").hidden = on; }
      if ($("lbStopFoot")) $("lbStopFoot").hidden = !on;
    }

    function stopRead() {
      if (window.TtsVoices && window.TtsVoices.stopSpeakQueue) window.TtsVoices.stopSpeakQueue();
      setReadingUi(false);
    }

    function speakQuote(text) {
      if (!text) return false;
      if (!window.speechSynthesis) {
        alert("此瀏覽器不支援語音朗讀，請用 Chrome、Edge 或 Safari。");
        return false;
      }
      window.speechSynthesis.getVoices();
      if (window.TtsVoices && window.TtsVoices.unlockSpeech) window.TtsVoices.unlockSpeech();
      const speak = (window.TtsVoices && window.TtsVoices.speakFromUserGesture)
        ? window.TtsVoices.speakFromUserGesture.bind(window.TtsVoices)
        : (window.TtsVoices && window.TtsVoices.speakQueued)
          ? window.TtsVoices.speakQueued.bind(window.TtsVoices)
          : null;
      if (speak && speak(text)) {
        setReadingUi(true);
        return true;
      }
      return false;
    }

    function readCurrent(force) {
      const it = filtered[idx];
      if (!it) return;
      if (!force && $("silentMode").checked) return;
      if (it.readTextSource === "manual" || it.readTextSource === "seed") {
        speakQuote(speechText(it));
        return;
      }
      const imgEl = isLightboxOpen() ? $("lbImg") : $("mainImg");
      const resolve = window.TaiyangReadText && window.TaiyangReadText.resolveSpeechText
        ? window.TaiyangReadText.resolveSpeechText(it, imgEl)
        : Promise.resolve(speechText(it));
      resolve.then(function (text) { speakQuote(text); });
    }

    function openLightbox(it) {
      if (!it) return;
      stopRead();
      $("lbImg").src = imgSrc(it);
      bindImageFallback($("lbImg"), it);
      const dq = displayQuote(it);
      $("lbTitle").textContent = dq.title;
      $("lbText").textContent = dq.text;
      $("lbPlain").textContent = dq.plain;
      updateNavUi();
      $("lightbox").hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      $("lightbox").hidden = true;
      document.body.style.overflow = "";
      stopRead();
    }

    function updateNavUi() {
      const n = filtered.length;
      const pos = n ? "第 " + (idx + 1) + " / " + n + " 則" : "—";
      if ($("navPos")) $("navPos").textContent = pos;
      if ($("lbPos")) $("lbPos").textContent = pos;
      const atStart = idx <= 0;
      const atEnd = idx >= n - 1;
      $("btnPrev").disabled = atStart;
      $("btnNext").disabled = atEnd;
      if ($("lbPrev")) $("lbPrev").disabled = atStart;
      if ($("lbNext")) $("lbNext").disabled = atEnd;
    }

    function isLightboxOpen() {
      return $("lightbox") && !$("lightbox").hidden;
    }

    function navigate(delta, preferPopup) {
      if (!filtered.length) return;
      const next = idx + delta;
      if (next < 0 || next >= filtered.length) return;
      showItem(next, false, preferPopup || isLightboxOpen());
    }

    function bindSwipe(el, onPrev, onNext) {
      if (!el) return;
      let x0 = 0, y0 = 0;
      el.addEventListener("touchstart", function (e) {
        x0 = e.changedTouches[0].clientX;
        y0 = e.changedTouches[0].clientY;
      }, { passive: true });
      el.addEventListener("touchend", function (e) {
        const dx = e.changedTouches[0].clientX - x0;
        const dy = e.changedTouches[0].clientY - y0;
        if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
        if (dx < 0) onNext(); else onPrev();
      }, { passive: true });
    }

    function showItem(i, autoRead, openPopup) {
      if (!filtered.length) return;
      idx = Math.max(0, Math.min(i, filtered.length - 1));
      const it = filtered[idx];
      $("mainImg").src = imgSrc(it);
      bindImageFallback($("mainImg"), it);
      const dq = displayQuote(it);
      $("nowTitle").textContent = dq.title;
      $("nowText").textContent = dq.text;
      $("nowPlain").textContent = dq.plain;
      renderList();
      updateNavUi();
      history.replaceState(null, "", "?item=" + encodeURIComponent(it.id));
      if (openPopup) openLightbox(it);
      else if (isLightboxOpen()) closeLightbox();
      if (autoRead) readCurrent(false);
    }

    function renderList() {
      $("itemList").innerHTML = "";
      filtered.forEach((it, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "item" + (i === idx ? " active" : "");
        b.innerHTML = "<span class=\"t\">" + (it.title || it.text || "太陽心語") + "</span><span class=\"m\">" + (it.category || "") + "</span>";
        b.onclick = () => showItem(i, false, true);
        $("itemList").appendChild(b);
      });
    }

    function applyFilter() {
      const q = ($("searchBox").value || "").trim().toLowerCase();
      filtered = items.filter((it) => {
        const hay = ((it.title || "") + (it.text || "") + (it.plain || "")).toLowerCase();
        return !q || hay.includes(q);
      });
      showItem(0, false, false);
    }

    fetch(CATALOG_URL).then((r) => r.json()).then((data) => {
      items = data.items || [];
      const want = new URLSearchParams(location.search).get("item");
      applyFilter();
      if (want) {
        const fi = filtered.findIndex((x) => x.id === want);
        if (fi >= 0) showItem(fi, false, false);
      }
    });

    $("searchBox").addEventListener("input", applyFilter);
    $("btnPrev").onclick = () => navigate(-1, false);
    $("btnNext").onclick = () => navigate(1, false);
    $("mainImg").onclick = () => { if (filtered[idx]) openLightbox(filtered[idx]); };
    $("lbClose").onclick = closeLightbox;
    $("lbCloseFoot").onclick = closeLightbox;
    $("lbPrev").onclick = () => navigate(-1, true);
    $("lbNext").onclick = () => navigate(1, true);
    $("lbRead").onclick = () => readCurrent(true);
    $("lbReadFoot").onclick = () => readCurrent(true);
    $("lbStopFoot").onclick = stopRead;
    $("lightbox").onclick = (e) => { if (e.target === $("lightbox")) closeLightbox(); };
    $("btnRead").onclick = () => readCurrent(true);
    bindSwipe($("mainImg"), () => navigate(-1, false), () => navigate(1, false));
    bindSwipe($("lbImg"), () => navigate(-1, true), () => navigate(1, true));
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      function primeTts() {
        window.speechSynthesis.getVoices();
        if (window.TtsVoices && window.TtsVoices.unlockSpeech) window.TtsVoices.unlockSpeech();
      }
      document.addEventListener("touchstart", primeTts, { once: true, passive: true });
      document.addEventListener("click", primeTts, { once: true });
    }
    if (window.TtsVoices) {
      window.TtsVoices.onSpeakStatus(function (st) {
        if (st && (st.reason === "done" || st.reason === "stop")) setReadingUi(false);
      });
    }
  </script>
</body>
</html>
