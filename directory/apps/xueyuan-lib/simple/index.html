<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e5f82" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="學員影音庫" />
  <meta name="description" content="超級生命密碼學員分享影音簡易版：依問題關鍵字分類、快速搜尋、即播、可分享。" />
  <link rel="icon" href="../icon-192.png?v=20260907a" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png?v=20260907a" sizes="180x180" />
  <link rel="apple-touch-icon" href="../icon-192.png?v=20260907a" sizes="192x192" />
  <title>學員分享影音｜簡易版</title>
  <style>
    :root { --accent: #1e5f82; --accent2: #3896b4; --muted: #4a6a7a; --line: rgba(30,95,130,0.22); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang TC", "Noto Sans TC", sans-serif;
      color: #1a3040; line-height: 1.55;
      background: linear-gradient(180deg, #f8fcff, #d2e8f5);
      padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
    }
    .wrap { max-width: 24rem; margin: 0 auto; padding-bottom: 2rem; }
    h1 { text-align: center; font-size: clamp(0.95rem, 4.5vw, 1.25rem); color: var(--accent); line-height: 1.35; }
    .sub { text-align: center; font-size: 0.82rem; color: var(--muted); margin: 0.25rem 0 0.75rem; }
    .search-box {
      padding: 0.75rem; background: rgba(255,255,255,0.85); border: 1px solid var(--line); border-radius: 0.5rem;
    }
    .search-box label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--accent); margin-bottom: 0.35rem; }
    input[type="search"] {
      width: 100%; font: inherit; font-size: 16px; padding: 0.65rem 0.75rem;
      border: 2px solid var(--accent2); border-radius: 0.45rem; background: #fff;
    }
    input[type="search"]:focus { outline: none; border-color: var(--accent); }
    .search-meta { margin-top: 0.35rem; font-size: 0.72rem; color: var(--muted); min-height: 1rem; }
    .search-toolbar { margin-top: 0.45rem; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
    .search-toolbar button { flex: 0 0 auto; width: auto; font-size: 0.76rem; padding: 0.45rem 0.65rem; }
    .search-toolbar .meta { margin-left: auto; font-size: 0.72rem; color: var(--muted); }
    .cat-row { margin-top: 0.55rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .cat-row button {
      font: inherit; font-size: 0.72rem; padding: 0.3rem 0.55rem; border-radius: 999px;
      border: 1px solid var(--line); background: #fff; color: var(--accent); cursor: pointer;
    }
    .cat-row button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .country-row { margin-top: 0.35rem; display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .country-row button {
      font: inherit; font-size: 0.68rem; padding: 0.25rem 0.45rem; border-radius: 999px;
      border: 1px solid var(--line); background: #fff; color: var(--accent); cursor: pointer;
    }
    .country-row button.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
    .layer { font-size: 0.68rem; font-weight: 700; color: var(--muted); margin-top: 0.4rem; }
    .list {
      margin-top: 0.55rem; max-height: 11rem; overflow-y: auto;
      border: 1px solid var(--line); border-radius: 0.35rem; background: #fff;
    }
    .item {
      display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line);
      background: transparent; padding: 0.6rem 0.65rem; cursor: pointer; font: inherit;
    }
    .item:last-child { border-bottom: 0; }
    .item.active { background: rgba(30, 95, 130, 0.08); }
    .item .t { font-size: 0.84rem; font-weight: 600; line-height: 1.35; }
    .item .note {
      margin-top: 0.22rem; font-size: 0.68rem; line-height: 1.35; color: var(--accent);
      background: rgba(30,95,130,0.08); border-radius: 0.28rem; padding: 0.22rem 0.4rem;
    }
    .item .m { font-size: 0.7rem; color: var(--muted); margin-top: 0.12rem; }
    .item-row { display: flex; gap: 0.35rem; align-items: flex-start; border-bottom: 1px solid var(--line); }
    .item-row:last-child { border-bottom: 0; }
    .item-row .pick { margin: 0.65rem 0 0 0.45rem; accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }
    .item-row .item { border-bottom: 0; flex: 1; }
    .pick-bar { margin-top: 0.4rem; display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; }
    .pick-bar .count { font-size: 0.72rem; font-weight: 700; color: var(--accent); }
    .pick-bar button { flex: 0 0 auto; width: auto; font-size: 0.72rem; padding: 0.35rem 0.5rem; }
    .player { margin-top: 0.65rem; padding: 0.65rem; background: rgba(255,255,255,0.85); border: 1px solid var(--line); border-radius: 0.5rem; }
    .now strong { color: var(--accent); display: block; line-height: 1.4; font-size: 0.9rem; }
    .now .meta { margin-top: 0.15rem; font-size: 0.72rem; color: var(--muted); }
    audio { width: 100%; margin-top: 0.55rem; }
    .video-shell { margin-top: 0.55rem; background: #111; border-radius: 0.45rem; overflow: hidden; aspect-ratio: 16/9; }
    .video-shell iframe { width: 100%; height: 100%; border: 0; }
    .actions { margin-top: 0.55rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
    button {
      flex: 1 1 calc(50% - 0.2rem); font: inherit; font-size: 0.82rem; padding: 0.55rem 0.5rem;
      border: 1px solid var(--line); border-radius: 0.35rem; cursor: pointer; background: #fff; color: var(--accent); font-weight: 600;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
    .toolbar { margin-top: 0.45rem; display: flex; gap: 0.35rem; }
    .toolbar button { flex: 1; font-size: 0.76rem; }
    .status { margin-top: 0.45rem; font-size: 0.75rem; color: var(--muted); text-align: center; min-height: 1rem; }
    .foot { margin-top: 1rem; font-size: 0.78rem; color: var(--muted); text-align: center; }
    .foot a { color: var(--accent); }
    [hidden] { display: none !important; }
    .player-mode-video #audioWrap { display: none !important; }
    .player-mode-audio #videoWrap { display: none !important; }
    .video-hint { margin-top: 0.45rem; font-size: 0.72rem; color: var(--muted); line-height: 1.45; }
    .yt-open {
      display: block; margin-top: 0.55rem; padding: 0.75rem; text-align: center; text-decoration: none;
      background: var(--accent); color: #fff; font-weight: 700; border-radius: 0.45rem; font-size: 0.88rem;
    }
    .yt-open:active { opacity: 0.92; }
    .yt-thumb { width: 100%; display: block; border-radius: 0.35rem; margin-top: 0.45rem; }
    .speed-row { margin-top: 0.45rem; display: flex; flex-wrap: wrap; gap: 0.28rem; align-items: center; }
    .speed-row .lab { font-size: 0.7rem; font-weight: 700; color: var(--muted); }
    .speed-row button {
      flex: 0 0 auto; width: auto; font-size: 0.72rem; padding: 0.35rem 0.5rem;
      border-radius: 0.3rem; border: 1px solid var(--line); background: #fff; color: var(--accent);
    }
    .speed-row button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>超級生命密碼<br />學員分享影音<br /><span style="font-size:0.85em">簡易版</span></h1>
    <p class="sub">①問題分類 → ②國家／地區 · 點標題即播 · 可輪播／暫停／上一檔下一檔</p>

    <section class="search-box">
      <label for="searchBox">🔍 快速搜尋</label>
      <input type="search" id="searchBox" placeholder="輸入關鍵字…（例：轉念、台灣、親子）" enterkeyhint="search" autocomplete="off" />
      <div class="search-toolbar">
        <button type="button" id="btnRefresh">🔄 更新目錄</button>
        <span class="meta" id="catalogMeta">載入中…</span>
      </div>
      <p class="search-meta" id="searchMeta">載入中…</p>
      <div class="pick-bar">
        <span class="count" id="pickCount">已勾選 0</span>
        <button type="button" id="btnSelectVisible">全選可見</button>
        <button type="button" id="btnClearPicks">清除勾選</button>
        <button type="button" class="primary" id="btnSharePicks">🔗 分享已勾選</button>
        <button type="button" class="primary" id="btnQueue">▶ 輪播</button>
      </div>
      <p class="layer">① 解決什麼問題</p>
      <div class="cat-row" id="catFilter"></div>
      <p class="layer">② 哪個國家／地區</p>
      <div class="country-row" id="countryFilter"></div>
      <div class="list" id="itemList"></div>
    </section>

    <section class="player" id="playerBox">
      <p class="now" id="nowLine"><strong>尚未播放</strong><span class="meta" id="nowMeta"></span></p>
      <div id="audioWrap"><audio id="audio" controls playsinline webkit-playsinline preload="metadata"></audio></div>
      <div class="video-shell" id="videoWrap" hidden>
        <iframe id="ytFrame" title="YouTube 播放" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <a class="yt-open" id="ytOpenLink" hidden href="#" target="_blank" rel="noopener noreferrer">▶ 在 YouTube 播放（建議 iPhone 用這個）</a>
      <p class="video-hint" id="videoHint" hidden>此則為 YouTube 影音，無法像音檔一樣在頁內播放。請點上方紅色連結或下方「在 YouTube 播放」。</p>
      <div class="actions">
        <button type="button" id="btnPlay" class="primary">▶ 播放／⏸ 暫停</button>
        <button type="button" id="btnPrev">⏮ 上一檔</button>
        <button type="button" id="btnNext">下一檔 ⏭</button>
        <button type="button" id="btnStopQueue">停止輪播</button>
        <button type="button" id="btnOpenApp" hidden>▶ 在 YouTube 開啟</button>
        <button type="button" id="btnShare">🔗 分享此則</button>
        <button type="button" id="btnShareSearch">🔗 分享搜尋</button>
      </div>
      <div class="speed-row" id="speedRow" aria-label="播放速度">
        <span class="lab">快轉</span>
        <button type="button" data-rate="1" class="active">1×</button>
        <button type="button" data-rate="1.5">1.5×</button>
        <button type="button" data-rate="1.75">1.75×</button>
        <button type="button" data-rate="2">2×</button>
      </div>
    </section>

    <p class="status" id="statusLine"></p>
    <p class="foot">
      <a href="../index.html">完整版</a>（圖書館分類、個人紀錄）
      · <a href="./share.html">加入主畫面</a>
    </p>
  </div>

  <script>
    const CATALOG_URL = "../catalog.json";
    const SHARE_BASE = "https://copyshae.github.io/-/xueyuan-lib/simple/";
    const STORAGE = "xueyuan-lib-simple-v1";
    const CATALOG_CACHE_KEY = "xueyuan-lib-catalog";
    let catalog = { categories: [] };
    let allFlat = [];
    let filtered = [];
    let filterCat = "all";
    let filterCountry = "all";
    let current = null;
    let persist = true;
    let searchTimer = null;
    let loadedAudioUrl = "";
    let selectedIds = new Set();
    let lastShown = [];
    let queueMode = false;
    let queueIndex = -1;
    let playRate = 1;
    const SPEED_OPTIONS = [1, 1.5, 1.75, 2];

    const $ = (id) => document.getElementById(id);
    const audio = $("audio");

    function setStatus(msg) {
      if (msg) $("statusLine").textContent = msg;
    }

    function itemNote(it) {
      if (it && it.note) return it.note;
      const tags = (it && it.problemTags) || [];
      const kw = tags.slice(0, 4).join("、") || ((it && it._catName) || "學員分享");
      const parts = ["解決問題關鍵字：" + kw];
      if (it && it._catName) parts.push(String(it._catName).replace(/｜.*/, ""));
      if (it && it.country) parts.push(it.country);
      return parts.join("｜");
    }

    function renderSpeedRow() {
      const el = $("speedRow");
      if (!el) return;
      el.querySelectorAll("button[data-rate]").forEach((b) => {
        b.className = Number(b.getAttribute("data-rate")) === playRate ? "active" : "";
      });
    }

    function applyPlayRate() {
      try { audio.playbackRate = playRate; } catch (_) {}
      renderSpeedRow();
    }

    function setPlayRate(rate) {
      const r = Number(rate);
      if (!SPEED_OPTIONS.includes(r)) return;
      playRate = r;
      applyPlayRate();
      setStatus("播放速度 " + playRate + "×");
    }

    function updatePickCount() {
      if ($("pickCount")) $("pickCount").textContent = "已勾選 " + selectedIds.size;
    }

    function updatePlayBtn() {
      if (current && isVideoItem(current)) {
        $("btnPlay").textContent = "▶ 在 YouTube 播放";
        return;
      }
      const playing = current && !isVideoItem(current) && !audio.paused;
      $("btnPlay").textContent = playing ? "⏸ 暫停" : "▶ 播放";
    }

    function isVideoItem(it) {
      if (!it) return false;
      if (it.type === "video") return true;
      const u = (it.playUrl || it.openUrl || "").toLowerCase();
      return u.includes("youtube.com") || u.includes("youtu.be");
    }

    function setPlayerMode(mode) {
      const box = $("playerBox");
      box.classList.remove("player-mode-audio", "player-mode-video");
      if (mode === "video") box.classList.add("player-mode-video");
      else if (mode === "audio") box.classList.add("player-mode-audio");
    }

    function isIOS() {
      return /iPad|iPhone|iPod/i.test(navigator.userAgent)
        || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    async function resolveAudioUrl(url) {
      if (!url || url.indexOf("firstory") < 0) return url;
      try {
        const res = await fetch(url, { method: "HEAD", mode: "cors", redirect: "follow" });
        return res.url || url;
      } catch (_) {
        return url;
      }
    }

    function ytVideoId(url) {
      const m = (url || "").match(/[?&]v=([^&]+)/) || (url || "").match(/youtu\.be\/([^?&]+)/);
      return m ? m[1] : "";
    }

    function ytEmbed(url, autoplay) {
      const id = ytVideoId(url);
      if (!id) return "";
      return "https://www.youtube.com/embed/" + id + "?rel=0&modestbranding=1&playsinline=1" + (autoplay ? "&autoplay=1" : "");
    }

    function openExternal(url) {
      if (!url) return false;
      const a = document.createElement("a");
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return true;
    }

    function updateYouTubeLink(it) {
      const link = $("ytOpenLink");
      const url = it && (it.openUrl || it.playUrl) || "";
      if (!link) return;
      if (isVideoItem(it) && url) {
        link.hidden = false;
        link.href = url;
        link.textContent = "▶ 在 YouTube 播放（iPhone 請點這裡）";
      } else {
        link.hidden = true;
        link.removeAttribute("href");
      }
    }

    function openYouTube(it) {
      const url = (it && (it.openUrl || it.playUrl)) || "";
      if (!url) {
        setStatus("無 YouTube 網址");
        return;
      }
      if (openExternal(url)) {
        setStatus("已開啟 YouTube");
        return;
      }
      location.href = url;
    }

    function showPlayError() {
      setStatus("播放失敗：請再按「播放」、點上方播放器，或在 YouTube 開啟");
    }

    function updateOpenAppBtn() {
      const btn = $("btnOpenApp");
      if (!btn) return;
      if (current && isVideoItem(current) && (current.openUrl || current.playUrl)) {
        btn.hidden = false;
        btn.textContent = "▶ 在 YouTube 開啟";
      } else if (current && current.openUrl && current.localApp === "fu-dao-ni-jia") {
        btn.hidden = false;
        btn.textContent = "▶ 在 YouTube 開啟";
      } else {
        btn.hidden = true;
      }
    }

    function startAudio(url, autoplay) {
      if (!url) {
        setStatus("無音檔網址");
        return;
      }
      setPlayerMode("audio");
      $("audioWrap").hidden = false;
      $("videoWrap").hidden = true;
      $("videoHint").hidden = true;
      $("ytOpenLink").hidden = true;
      $("ytFrame").src = "";
      loadedAudioUrl = url;
      audio.src = url;
      audio.playbackRate = playRate;
      audio.load();
      if (autoplay) {
        const playPromise = audio.play();
        if (playPromise && playPromise.catch) playPromise.catch(showPlayError);
      }
      if (url.indexOf("firstory") >= 0) {
        resolveAudioUrl(url).then((resolved) => {
          if (!resolved || resolved === url || loadedAudioUrl !== url) return;
          const wasPlaying = !audio.paused;
          audio.src = resolved;
          audio.load();
          if (wasPlaying) audio.play().catch(showPlayError);
        }).catch(() => {});
      }
    }

    function getShareBase() {
      if (location.origin && location.origin.indexOf("http") === 0) {
        return location.origin + location.pathname.replace(/\/index\.html$/, "").replace(/\/$/, "") + "/";
      }
      return SHARE_BASE;
    }

    function urlParams() {
      return new URLSearchParams(location.search);
    }

    function flattenCatalog() {
      allFlat = [];
      (catalog.categories || []).forEach((c) => {
        (c.items || []).forEach((it) => {
          allFlat.push(Object.assign({ _cat: c.id, _catName: c.name }, it));
        });
      });
    }

    function tokenize(q) {
      return (q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
    }

    function matchItem(it, tokens) {
      if (!tokens.length) return true;
      const hay = (
        (it.title || "") + " " + (it._catName || "") + " " + (it.country || "") + " " +
        ((it.problemTags || []).join(" ")) + " " + (it.note || "") + " " +
        (it.channel || "") + " " + (it.date || "")
      ).toLowerCase();
      return tokens.every((t) => hay.includes(t));
    }

    function fmtDur(sec) {
      const s = Number(sec);
      if (!s || s < 1) return "";
      return Math.floor(s / 60) + " 分";
    }

    function renderCountryFilter() {
      const el = $("countryFilter");
      if (!el) return;
      el.innerHTML = "";
      const counts = {};
      let pool = allFlat;
      if (filterCat !== "all") pool = pool.filter((it) => it._cat === filterCat);
      pool.forEach((it) => {
        const id = it.countryId || "other";
        counts[id] = (counts[id] || 0) + 1;
      });
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.textContent = "全部國家";
      allBtn.className = filterCountry === "all" ? "active" : "";
      allBtn.addEventListener("click", () => { filterCountry = "all"; renderCountryFilter(); renderList(); });
      el.appendChild(allBtn);
      const order = ["tw", "my", "sg", "cn", "hk", "us", "other"];
      const names = { tw: "台灣", my: "馬來西亞", sg: "新加坡", cn: "中國", hk: "香港", us: "美國", other: "其他／未標" };
      order.forEach((id) => {
        if (!counts[id]) return;
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = (names[id] || id) + " (" + counts[id] + ")";
        b.className = filterCountry === id ? "active" : "";
        b.addEventListener("click", () => { filterCountry = id; renderCountryFilter(); renderList(); });
        el.appendChild(b);
      });
    }

    function renderCatFilter() {
      const el = $("catFilter");
      el.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.textContent = "全部問題";
      allBtn.className = filterCat === "all" ? "active" : "";
      allBtn.addEventListener("click", () => { filterCat = "all"; filterCountry = "all"; renderCatFilter(); renderCountryFilter(); renderList(); });
      el.appendChild(allBtn);
      (catalog.categories || []).forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = c.name.replace(/｜.*/, "");
        b.className = filterCat === c.id ? "active" : "";
        b.addEventListener("click", () => { filterCat = c.id; filterCountry = "all"; renderCatFilter(); renderCountryFilter(); renderList(); });
        el.appendChild(b);
      });
      renderCountryFilter();
    }

    function renderList() {
      const rawQ = ($("searchBox").value || "").trim();
      const tokens = tokenize(rawQ);
      let pool = allFlat;
      if (tokens.length) {
        // 有搜尋時跨分類查全庫
        filtered = allFlat.filter((it) => matchItem(it, tokens));
        if (filterCountry !== "all") filtered = filtered.filter((it) => (it.countryId || "other") === filterCountry);
      } else {
        if (filterCat !== "all") pool = pool.filter((it) => it._cat === filterCat);
        if (filterCountry !== "all") pool = pool.filter((it) => (it.countryId || "other") === filterCountry);
        filtered = pool.slice();
      }
      const meta = $("searchMeta");
      if (tokens.length) {
        meta.textContent = filtered.length
          ? "找到 " + filtered.length + " 則 · 點標題即播 · 可輪播"
          : "找不到「" + rawQ + "」· 換個關鍵字";
      } else if (filterCat !== "all" || filterCountry !== "all") {
        meta.textContent = "此篩選共 " + filtered.length + " 則 · 點標題即播";
      } else {
        meta.textContent = "共 " + (catalog.count || allFlat.length) + " 則 · 先選問題，再選國家；或搜尋後輪播";
      }
      const list = $("itemList");
      list.innerHTML = "";
      if (!filtered.length) {
        lastShown = [];
        list.innerHTML = '<p style="padding:0.65rem;font-size:0.8rem;color:var(--muted)">無符合項目</p>';
        updatePickCount();
        return;
      }
      const show = filtered.slice(0, tokens.length ? 40 : 30);
      lastShown = show;
      show.forEach((it) => {
        const row = document.createElement("div");
        row.className = "item-row";
        const pick = document.createElement("input");
        pick.type = "checkbox";
        pick.className = "pick";
        pick.checked = selectedIds.has(it.id);
        pick.addEventListener("click", (e) => e.stopPropagation());
        pick.addEventListener("change", () => {
          if (pick.checked) selectedIds.add(it.id);
          else selectedIds.delete(it.id);
          updatePickCount();
        });
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "item" + (current && current.id === it.id ? " active" : "");
        const typ = it.type === "audio" ? "音檔" : "影音";
        const co = it.country ? " · " + it.country : "";
        const note = itemNote(it);
        btn.innerHTML =
          '<div class="t">' + it.title + '</div>' +
          '<div class="note">備註：' + note + '</div>' +
          '<div class="m">' + (it._catName || "").replace(/｜.*/, "") + co + " · " + typ + (it.date ? " · " + it.date : "") + (it.duration ? " · " + fmtDur(it.duration) : "") + " · 點我播放</div>";
        btn.addEventListener("click", () => {
          queueMode = false;
          playItem(it, true, true);
        });
        row.appendChild(pick);
        row.appendChild(btn);
        list.appendChild(row);
      });
      if (filtered.length > show.length) {
        const p = document.createElement("p");
        p.style.cssText = "padding:0.5rem 0.65rem;font-size:0.72rem;color:var(--muted)";
        p.textContent = "還有 " + (filtered.length - show.length) + " 則，請縮小關鍵字或按輪播";
        list.appendChild(p);
      }
      updatePickCount();
    }

    function playIndex(i, autoplay) {
      if (i < 0 || i >= filtered.length) {
        if (i >= filtered.length) {
          queueMode = false;
          setStatus("已播完清單");
        }
        return;
      }
      queueIndex = i;
      playItem(filtered[i], autoplay, true);
      if (queueMode) setStatus("輪播中 " + (i + 1) + "/" + filtered.length + " · " + playRate + "×");
    }

    function playRelative(delta) {
      let i = filtered.findIndex((x) => current && x.id === current.id);
      if (i < 0) i = Math.max(0, queueIndex);
      playIndex(i + delta, true);
    }

    function startQueue() {
      if (!filtered.length) { setStatus("請先搜尋或篩選"); return; }
      queueMode = true;
      const i = Math.max(0, filtered.findIndex((x) => current && x.id === current.id));
      playIndex(i < 0 ? 0 : i, true);
    }

    function playFirstSearchResult() {
      if (!filtered.length) return;
      playItem(filtered[0], true, true);
      const box = document.getElementById("playerBox");
      if (box) box.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function scheduleSearchAutoplay() {
      /* 不在此自動播：iPhone 需使用者點選列表才允許出聲 */
    }

    function onSearchInput() {
      renderList();
      scheduleSearchAutoplay();
    }

    function playItem(it, autoplay, fromUser) {
      if (!it) return;
      current = it;
      queueIndex = filtered.findIndex((x) => x.id === it.id);
      if (fromUser) persist = true;
      if (persist) try { localStorage.setItem(STORAGE, it.id); } catch (_) {}
      $("nowLine").innerHTML = "<strong>" + it.title + "</strong>";
      $("nowMeta").textContent = "備註：" + itemNote(it)
        + " · " + (isVideoItem(it) ? "YouTube 影音" : "音檔")
        + (queueMode ? (" · 輪播 " + (queueIndex + 1) + "/" + filtered.length) : "")
        + " · " + playRate + "×"
        + (it.date ? " · " + it.date : "");
      if (isVideoItem(it)) {
        loadedAudioUrl = "";
        audio.pause();
        audio.removeAttribute("src");
        setPlayerMode("video");
        $("audioWrap").hidden = true;
        $("videoHint").hidden = false;
        updateYouTubeLink(it);
        if (isIOS()) {
          $("videoWrap").hidden = true;
          $("ytFrame").src = "";
          setStatus("YouTube 影音：請點紅色「在 YouTube 播放」（頁內無法調速）");
        } else {
          $("videoWrap").hidden = false;
          $("ytFrame").src = ytEmbed(it.playUrl || it.openUrl || "", autoplay && fromUser);
          setStatus("YouTube 頁內播放；快轉請用下方速度或到 YouTube App");
        }
      } else {
        startAudio(it.playUrl || "", autoplay);
        applyPlayRate();
      }
      updatePlayBtn();
      updateOpenAppBtn();
      setTimeout(() => renderList(), 0);
    }

    function playById(id, autoplay) {
      const it = allFlat.find((x) => x.id === id);
      if (it) {
        filterCat = it._cat;
        filterCountry = it.countryId || "all";
        renderCatFilter();
        playItem(it, autoplay, false);
        return true;
      }
      return false;
    }

    async function fetchCatalog(force) {
      const tryFetch = async (url) => {
        const res = await fetch(url, { cache: force ? "no-store" : "default" });
        return res.ok ? res.json() : null;
      };
      try {
        const data = await tryFetch(CATALOG_URL + (force ? "?t=" + Date.now() : ""));
        if (data) return data;
      } catch (_) {}
      if (force) {
        try {
          const data = await tryFetch(CATALOG_URL + "?t=" + Date.now());
          if (data) return data;
        } catch (_) {}
      }
      try {
        const data = await tryFetch(CATALOG_URL);
        if (data) return data;
      } catch (_) {}
      try {
        const s = localStorage.getItem(CATALOG_CACHE_KEY);
        if (s) return JSON.parse(s);
      } catch (_) {}
      return null;
    }

    function saveCatalogCache(data) {
      try { localStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify(data)); } catch (_) {}
    }

    function updateCatalogMeta() {
      const n = catalog.count || allFlat.length || 0;
      const d = catalog.updatedAt || "—";
      $("catalogMeta").textContent = n + " 則 · 更新日 " + d;
    }

    async function loadCatalog(force) {
      $("statusLine").textContent = force ? "更新目錄…" : "載入中…";
      if (force) $("btnRefresh").disabled = true;
      let remote = null;
      try {
        remote = await fetchCatalog(force);
      } catch (_) {}
      if (remote) {
        catalog = remote;
        saveCatalogCache(remote);
      } else {
        try {
          const s = localStorage.getItem(CATALOG_CACHE_KEY);
          if (s) catalog = JSON.parse(s);
        } catch (_) {}
      }
      flattenCatalog();
      renderCatFilter();
      const sharedQ = (urlParams().get("q") || "").trim();
      if (sharedQ) {
        $("searchBox").value = sharedQ;
        filterCat = "all";
        renderCatFilter();
      }
      renderList();
      updateCatalogMeta();
      applyUrlParams();
      const sharedQOnly = (urlParams().get("q") || "").trim();
      if (sharedQOnly && !urlParams().get("item") && filtered.length) {
        setTimeout(() => playFirstSearchResult(), 300);
      }
      if (!current && persist) {
        try {
          const last = localStorage.getItem(STORAGE);
          if (last && playById(last, false)) {}
        } catch (_) {}
      }
      if (!current) renderList();
      $("statusLine").textContent = remote
        ? (force ? "目錄已更新 · 共 " + (catalog.count || allFlat.length) + " 則" : "已載入最新目錄")
        : "無法連線，使用本機快取 · 共 " + allFlat.length + " 則";
      if (force) $("btnRefresh").disabled = false;
    }

    function applyUrlParams() {
      const sharedItem = (urlParams().get("item") || "").trim();
      const sharedItems = (urlParams().get("items") || "").trim();
      const sharedQ = (urlParams().get("q") || "").trim();
      const sharedCat = (urlParams().get("cat") || "").trim();
      const sharedCountry = (urlParams().get("country") || "").trim();
      if (sharedCat && (catalog.categories || []).some((c) => c.id === sharedCat)) {
        filterCat = sharedCat;
      }
      if (sharedCountry) filterCountry = sharedCountry;
      if (sharedItems) {
        sharedItems.split(",").map((x) => x.trim()).filter(Boolean).forEach((id) => selectedIds.add(id));
        updatePickCount();
      }
      if (sharedCat || sharedCountry) {
        renderCatFilter();
        renderList();
      }
      if (sharedQ) {
        persist = false;
        $("statusLine").textContent = "已從分享連結載入搜尋（不寫入個人記錄）";
      }
      if (sharedItem) {
        persist = false;
        if (playById(sharedItem, true)) {
          $("statusLine").textContent = "已從分享連結開啟（不寫入個人記錄）";
        }
      } else if (sharedItems && !sharedQ) {
        const ids = sharedItems.split(",").map((x) => x.trim()).filter(Boolean);
        filtered = allFlat.filter((x) => ids.includes(x.id));
        persist = false;
        renderList();
        if (filtered.length) {
          playItem(filtered[0], true, false);
          setStatus("已開啟分享清單 " + filtered.length + " 則 · 可輪播");
        }
      } else if (sharedCat && !sharedQ) {
        const nm = ((catalog.categories || []).find((c) => c.id === filterCat) || {}).name || sharedCat;
        $("statusLine").textContent = "已開啟分類：" + nm.replace(/｜.*/, "");
      }
    }

    async function shareCurrent() {
      const id = current ? current.id : "";
      if (!id) { $("statusLine").textContent = "請先選取一則"; return; }
      const url = getShareBase() + "?item=" + encodeURIComponent(id);
      const title = current ? current.title : "學員分享影音";
      const text = title + "\n備註：" + itemNote(current) + "\n學員分享影音";
      if (navigator.share) {
        try {
          await navigator.share({ title, text, url });
          return;
        } catch (e) { if (e && e.name === "AbortError") return; }
      }
      try {
        await navigator.clipboard.writeText(text + "\n" + url);
        $("statusLine").textContent = "已複製分享（含備註）";
      } catch (_) { window.prompt("複製：", text + "\n" + url); }
    }

    async function sharePicks() {
      const items = allFlat.filter((x) => selectedIds.has(x.id));
      if (!items.length) { setStatus("請先勾選影音"); return; }
      const ids = items.map((x) => x.id).slice(0, 30);
      const url = getShareBase() + "?items=" + encodeURIComponent(ids.join(","));
      const text = "學員分享影音（" + items.length + " 則）\n\n" + items.slice(0, 30).map((it, i) =>
        (i + 1) + ". " + it.title + "\n   備註：" + itemNote(it)
      ).join("\n\n");
      if (navigator.share) {
        try {
          await navigator.share({ title: "學員分享×" + items.length, text, url });
          return;
        } catch (e) { if (e && e.name === "AbortError") return; }
      }
      try {
        await navigator.clipboard.writeText(text + "\n" + url);
        setStatus("已複製多則分享");
      } catch (_) { window.prompt("複製：", text + "\n" + url); }
    }

    async function shareSearch() {
      const q = ($("searchBox").value || "").trim();
      const parts = [];
      if (q) parts.push("q=" + encodeURIComponent(q));
      if (filterCat !== "all") parts.push("cat=" + encodeURIComponent(filterCat));
      if (filterCountry !== "all") parts.push("country=" + encodeURIComponent(filterCountry));
      if (!parts.length) { $("statusLine").textContent = "請先輸入關鍵字或選分類／國家"; return; }
      const url = getShareBase() + "?" + parts.join("&");
      const label = q || ("分類 " + filterCat + (filterCountry !== "all" ? "／" + filterCountry : ""));
      if (navigator.share) {
        try {
          await navigator.share({ title: "學員分享｜" + label, text: "學員分享影音｜" + label, url });
          return;
        } catch (e) { if (e && e.name === "AbortError") return; }
      }
      try {
        await navigator.clipboard.writeText(url);
        $("statusLine").textContent = "已複製搜尋／分類分享網址";
      } catch (_) { window.prompt("複製搜尋分享：", url); }
    }

    $("searchBox").addEventListener("input", onSearchInput);
    $("searchBox").addEventListener("search", () => {
      if (($("searchBox").value || "").trim()) playFirstSearchResult();
    });
    $("searchBox").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && filtered.length) {
        e.preventDefault();
        playFirstSearchResult();
      }
    });
    $("btnPlay").addEventListener("click", () => {
      if (!current && filtered.length) {
        playItem(filtered[0], true, true);
        return;
      }
      if (!current) {
        setStatus("請先搜尋或選取");
        return;
      }
      if (isVideoItem(current)) {
        openYouTube(current);
        return;
      }
      if (!audio.paused) {
        audio.pause();
        setStatus("已暫停");
        return;
      }
      if (audio.src && loadedAudioUrl === (current.playUrl || "")) {
        audio.playbackRate = playRate;
        audio.play().catch(showPlayError);
      } else {
        startAudio(current.playUrl || "", true);
      }
    });
    if ($("btnPrev")) $("btnPrev").addEventListener("click", () => playRelative(-1));
    if ($("btnNext")) $("btnNext").addEventListener("click", () => playRelative(1));
    if ($("btnQueue")) $("btnQueue").addEventListener("click", startQueue);
    if ($("btnStopQueue")) $("btnStopQueue").addEventListener("click", () => {
      queueMode = false;
      setStatus("已停止輪播");
    });
    if ($("btnSelectVisible")) $("btnSelectVisible").addEventListener("click", () => {
      lastShown.forEach((it) => selectedIds.add(it.id));
      renderList();
    });
    if ($("btnClearPicks")) $("btnClearPicks").addEventListener("click", () => {
      selectedIds.clear();
      renderList();
    });
    if ($("btnSharePicks")) $("btnSharePicks").addEventListener("click", sharePicks);
    const speedRow = $("speedRow");
    if (speedRow) {
      speedRow.addEventListener("click", (e) => {
        const b = e.target && e.target.closest ? e.target.closest("button[data-rate]") : null;
        if (b) setPlayRate(b.getAttribute("data-rate"));
      });
    }
    audio.addEventListener("loadedmetadata", () => { applyPlayRate(); setStatus(""); });
    audio.addEventListener("canplay", () => setStatus(""));
    audio.addEventListener("play", () => { applyPlayRate(); updatePlayBtn(); });
    audio.addEventListener("pause", updatePlayBtn);
    audio.addEventListener("ended", () => {
      updatePlayBtn();
      if (queueMode) playRelative(1);
    });
    audio.addEventListener("error", () => {
      setStatus("音檔載入失敗：請按「播放」重試，或在 YouTube 開啟");
      updateOpenAppBtn();
    });
    $("btnOpenApp").addEventListener("click", () => {
      if (!current) return;
      if (isVideoItem(current)) openYouTube(current);
      else if (current.openUrl) location.href = current.openUrl;
    });
    $("btnShare").addEventListener("click", shareCurrent);
    $("btnShareSearch").addEventListener("click", shareSearch);
    $("btnRefresh").addEventListener("click", () => loadCatalog(true));

    renderSpeedRow();
    loadCatalog(false);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js?v=12").catch(() => {});
  </script>
</body>
</html>
